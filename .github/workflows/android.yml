name: Build Android app

# Every push builds the APK (downloadable from the run's artifacts).
# Pushing a version tag such as v0.2.0 also publishes it as a GitHub Release:
#   1. bump versionCode/versionName in android/app/build.gradle.kts
#   2. git tag -a v0.2.0 -F notes.md   (the tag message becomes the release notes)
#   3. git push origin v0.2.0
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - "species/**"
      - "training/check_species.py"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-species:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate species list and labels
        run: python training/check_species.py
      - name: Compile training scripts
        run: python -m py_compile training/*.py

  build-apk:
    runs-on: ubuntu-latest
    needs: check-species
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -q "versionName = \"${TAG#v}\"" android/app/build.gradle.kts; then
            echo "::error::Tag $TAG does not match versionName in android/app/build.gradle.kts"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/nys-tree-id-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: nys-tree-id-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nys-tree-id-apk
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          mv dist/*.apk "dist/nys-tree-id-$TAG.apk"
          flags=()
          case "$TAG" in v0.*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "dist/nys-tree-id-$TAG.apk" \
            --title "NY Tree ID $TAG" --notes-file notes.md --verify-tag "${flags[@]}"
