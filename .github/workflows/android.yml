name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - "species/**"
      - "training/check_species.py"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

jobs:
  check-species:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate species list and labels
        run: python training/check_species.py
      - name: Compile training scripts
        run: python -m py_compile training/*.py

  build-apk:
    runs-on: ubuntu-latest
    needs: check-species
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/nys-tree-id-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: nys-tree-id-apk
          path: dist/*.apk
          if-no-files-found: error
