name: Build Android app

# Every push builds the APK (downloadable from the run's artifacts).
#
# To publish a GitHub Release:
#   1. bump versionCode/versionName in android/app/build.gradle.kts (e.g. 0.2.0)
#   2. write the release notes in android/release-notes/v0.2.0.md
#   3. either push a tag v0.2.0, or run this workflow from the Actions tab
#      ("Run workflow") with "Publish a GitHub Release" ticked
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - "species/**"
      - "training/check_species.py"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for the version in build.gradle.kts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-species:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate species list and labels
        run: python training/check_species.py
      - name: Compile training scripts
        run: python -m py_compile training/*.py

  build-apk:
    runs-on: ubuntu-latest
    needs: check-species
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -q "versionName = \"${TAG#v}\"" android/app/build.gradle.kts; then
            echo "::error::Tag $TAG does not match versionName in android/app/build.gradle.kts"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
      - name: Verify the APK stays offline
        run: |
          permissions=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions android/app/build/outputs/apk/release/app-release.apk)
          if echo "$permissions" | grep -q 'android.permission.INTERNET'; then
            echo "::error::The APK must never request INTERNET"
            exit 1
          fi
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/nys-tree-id-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: nys-tree-id-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nys-tree-id-apk
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          TAG="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          notes="android/release-notes/$TAG.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::Missing release notes: $notes"
            exit 1
          fi
          mv dist/*.apk "dist/nys-tree-id-$TAG.apk"
          flags=()
          case "$TAG" in v0.*) flags+=(--prerelease) ;; esac
          # Creates the tag at this commit if it doesn't exist yet; refuses to overwrite a release.
          gh release create "$TAG" "dist/nys-tree-id-$TAG.apk" --target "$GITHUB_SHA" \
            --title "NY Tree ID $TAG" --notes-file "$notes" "${flags[@]}"
